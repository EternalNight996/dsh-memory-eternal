<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>记忆核心 · 知识图谱 抗压 + 交互 Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(140% 120% at 50% -10%, #16213f 0%, #0b1020 60%); color: #e8eefc; min-height: 100vh; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 28px 22px 60px; }
  .head h1 { font-size: 20px; margin: 0 0 6px; }
  .head p { margin: 0; color: #93a3c4; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 12px 0 12px; }
  .toolbar .count { color: #93a3c4; font-size: 12px; }
  .toolbar .sp { flex: 1; }
  button { border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: #e8eefc; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
  .canvas { position: relative; height: 620px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); overflow: hidden; background: radial-gradient(120% 120% at 50% 35%, #1a2749 0%, #0d1430 55%, #0a0f22 100%); cursor: grab; touch-action: none; user-select: none; }
  .canvas.dragging { cursor: grabbing; }
  .canvas svg { width: 100%; height: 100%; display: block; }
  .edge { fill: none; stroke: rgba(255,255,255,.25); stroke-width: 1.1; stroke-dasharray: 3 5; animation: dash 1.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -16; } }
  .node text { font-size: 11px; fill: #dbe5fb; paint-order: stroke; stroke: rgba(10,14,32,.85); stroke-width: 3px; pointer-events: none; }
  .labels text { font-size: 11px; fill: #dbe5fb; paint-order: stroke; stroke: rgba(10,14,32,.85); stroke-width: 3px; pointer-events: none; transition: opacity .12s; }
  .labels text.minor { opacity: 0; }
  .labels.all text { opacity: 0.85; }
  .labels text.dim { opacity: 0.06; }
  .node.dim { opacity: 0.14; transition: opacity .18s; }
  .node.focus circle { stroke: #fff; }
  .edge.dim { opacity: 0.05; }
  .edge.focus { opacity: 1; }
  .hint { margin-top: 10px; color: #93a3c4; font-size: 12px; }
  .hint b { color: #e8eefc; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🧠 知识图谱 · 抗压 + 交互 Demo</h1>
    <p>218 个节点 · 约 500 条连线（径向布局，O(n) 秒算）。<b>左键凸显关联 · 右键打开卡片</b> · 滚轮缩放（指向光标）· 按住左键拖动画布。</p>
  </div>
  <div class="toolbar">
    <span class="count" id="count"></span>
    <span class="sp"></span>
    <button onclick="zoom(1/1.3)">缩小</button>
    <button onclick="fit()">适应</button>
    <button onclick="zoom(1.3)">放大</button>
  </div>
  <div class="canvas" id="canvas"></div>
  <div class="hint">✅ 已用 <b>径向布局</b>（按 kind 分区环形），218 节点布局 <b>即时</b>；小图（≤160）自动切换为<b>力导向</b>布局。<br/>🖱 <b>左键凸显关联 / 右键打开卡片</b> · 滚轮缩放 · 按住左键拖动画布 · 左键点空白处取消高亮。</div>
</div>

<script>
  const W = 980, H = 620;
  const KIND = { project: '#3b82f6', knowledge: '#22c55e', content: '#f43f5e', prompt: '#06b6d4', business: '#eab308', other: '#8b5cf6' };
  const kinds = ['project','knowledge','content','prompt','business'];

  // 生成 218 个节点 + 约 500 条边（可复现 seed）
  let seed = 42;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  const nodes = Array.from({ length: 218 }, (_, i) => ({ id: 'n' + i, title: '记忆卡 ' + (i + 1), kind: kinds[i % 5] }));
  const edges = [];
  const seen = new Set();
  for (let i = 0; i < 800; i++) {
    const a = Math.floor(rnd() * nodes.length), b = Math.floor(rnd() * nodes.length);
    if (a === b) continue;
    const key = [a, b].sort((x, y) => x - y).join('|');
    if (seen.has(key)) continue; seen.add(key);
    edges.push({ source: nodes[a].id, target: nodes[b].id });
    if (edges.length >= 500) break;
  }

  function hexToRgb(h) { const x = h.replace('#', ''); const f = x.length === 3 ? x.split('').map(c => c + c).join('') : x; return [parseInt(f.slice(0, 2), 16), parseInt(f.slice(2, 4), 16), parseInt(f.slice(4, 6), 16)]; }
  function lighten(h, a) { const [r, g, b] = hexToRgb(h); return `rgb(${Math.round(r + (255 - r) * a)},${Math.round(g + (255 - g) * a)},${Math.round(b + (255 - b) * a)})`; }
  function darken(h, a) { const [r, g, b] = hexToRgb(h); return `rgb(${Math.round(r * (1 - a))},${Math.round(g * (1 - a))},${Math.round(b * (1 - a))})`; }

  function radialLayout(nodes, width, height) {
    const n = nodes.length, cx = width / 2, cy = height / 2, radius = Math.min(width, height) / 2 - 80;
    const byKind = {}; nodes.forEach((nd, i) => { (byKind[nd.kind] = byKind[nd.kind] || []).push(i) });
    const kinds = Object.keys(byKind), pos = new Array(n); let angle = -Math.PI / 2;
    for (const kind of kinds) { const g = byKind[kind]; const span = (g.length / n) * Math.PI * 2; const start = angle; g.forEach((idx, i) => { const a = g.length === 1 ? start + span / 2 : start + span * (i + 0.5) / g.length; pos[idx] = { x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) } }); angle += span; }
    return pos;
  }
  function edgePath(a, b) { const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, dist = Math.sqrt(dx * dx + dy * dy) || 1, bend = Math.min(38, dist * 0.18), cx = mx - (dy / dist) * bend, cy = my + (dx / dist) * bend; return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`; }

  const layout = radialLayout(nodes, W, H);
  const deg = {}; edges.forEach(e => { deg[e.source] = (deg[e.source] || 0) + 1; deg[e.target] = (deg[e.target] || 0) + 1; });
  const idx = nodes.reduce((m, nd, i) => (m[nd.id] = i, m), {});
  const maxDeg = Math.max(1, ...Object.values(deg));

  let defs = ''; Object.keys(KIND).forEach(k => { defs += `<radialGradient id="g-${k}" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="${lighten(KIND[k], 0.55)}"/><stop offset="60%" stop-color="${KIND[k]}"/><stop offset="100%" stop-color="${darken(KIND[k], 0.25)}"/></radialGradient><linearGradient id="e-${k}" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="${KIND[k]}" stop-opacity="0.4"/><stop offset="100%" stop-color="${KIND[k]}" stop-opacity="0.85"/></linearGradient>`; });
  defs += `<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

  let es = edges.map((e, i) => { const si = idx[e.source], ti = idx[e.target]; if (si === undefined || ti === undefined) return ''; const a = layout[si], b = layout[ti]; const kind = nodes[si].kind || 'other'; return `<path d="${edgePath(a, b)}" class="edge" data-s="${e.source}" data-t="${e.target}" style="stroke:url(#e-${kind});animation-delay:${(i % 8) * 0.1}s"/>`; }).join('');
  const sortedDeg = nodes.map(nd => deg[nd.id] || 0).sort((a, b) => b - a);
  const hubMin = sortedDeg[Math.min(nodes.length, 18) - 1] ?? Infinity;
  let ns = nodes.map((nd, i) => { const p = layout[i], kind = nd.kind || 'other', r = 6 + Math.min(8, (deg[nd.id] || 0) / maxDeg * 8); return `<g class="node" data-id="${nd.id}" transform="translate(${p.x} ${p.y})" onclick="focusNode('${nd.id}',event)" oncontextmenu="openCard('${nd.id}',event)"><circle r="${r}" fill="url(#g-${kind})" stroke="${KIND[kind]}" stroke-opacity="0.9" filter="url(#glow)"/><circle r="${Math.max(2, r * 0.2)}" fill="rgba(255,255,255,.85)"/></g>`; }).join('');
  let lbs = nodes.map((nd, i) => { const p = layout[i], r = 6 + Math.min(8, (deg[nd.id] || 0) / maxDeg * 8), hub = (deg[nd.id] || 0) >= hubMin; return `<text class="${hub ? '' : 'minor'}" data-id="${nd.id}" x="${p.x + r + 8}" y="${p.y + 4}">${nd.title}</text>`; }).join('');

  const canvas = document.getElementById('canvas');
  canvas.innerHTML = `<svg id="svg"><defs>${defs}</defs><g id="inner">${es}${ns}<g class="labels" id="labels">${lbs}</g></g></svg>`;
  document.getElementById('count').textContent = `${nodes.length} 节点 · ${edges.length} 连线`;

  // -- 平移/缩放（写 <g> 的 transform，避免整树重渲染） --
  const inner = document.getElementById('inner');
  const svg = document.getElementById('svg');
  const tf = { x: 0, y: 0, k: 1 };
  function apply() { inner.setAttribute('transform', `translate(${tf.x} ${tf.y}) scale(${tf.k})`); const lb = document.getElementById('labels'); if (lb) lb.classList.toggle('all', tf.k >= 1.4); }
  function svgPoint(cx, cy) { const ctm = svg.getScreenCTM(); if (!ctm) return { x: cx, y: cy }; const pt = new DOMPoint(cx, cy).matrixTransform(ctm.inverse()); return { x: pt.x, y: pt.y }; }
  function zoom(factor, p) {
    const k2 = Math.min(5, Math.max(0.25, tf.k * factor));
    tf.x = p.x - (k2 / tf.k) * (p.x - tf.x);
    tf.y = p.y - (k2 / tf.k) * (p.y - tf.y);
    tf.k = k2; apply();
  }
  function zoomAt(px, py, factor) { zoom(factor, svgPoint(px, py)); }
  function fit() { tf.x = 0; tf.y = 0; tf.k = 1; apply(); }
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });

  let drag = null, moved = false;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const p = svgPoint(e.clientX, e.clientY);
    drag = { px: p.x, py: p.y, tx: tf.x, ty: tf.y, started: false, id: e.pointerId };
    moved = false;
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const p = svgPoint(e.clientX, e.clientY);
    if (Math.abs(p.x - drag.px) + Math.abs(p.y - drag.py) > 1.5) {
      moved = true;
      if (!drag.started && canvas.setPointerCapture) { canvas.setPointerCapture(e.pointerId); drag.started = true; }
      canvas.classList.add('dragging');
      tf.x = drag.tx + (p.x - drag.px); tf.y = drag.ty + (p.y - drag.py); apply();
    }
  });
  canvas.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('dragging'); });
  window.openCard = (id, e) => { if (e && e.preventDefault) e.preventDefault(); if (e && e.stopPropagation) e.stopPropagation(); alert('打开记忆卡：' + id); };
  apply();

  // -- 右键凸显关联节点 / 淡化无关联节点 --
  const adjMap = {}; nodes.forEach(nd => adjMap[nd.id] = new Set());
  edges.forEach(e => { adjMap[e.source].add(e.target); adjMap[e.target].add(e.source); });
  let focusId = null;
  function applyFocus(id) {
    focusId = id;
    const rel = new Set();
    if (id) { rel.add(id); adjMap[id].forEach(x => rel.add(x)); }
    document.querySelectorAll('.node').forEach(g => { const nid = g.dataset.id; g.classList.toggle('dim', !!(id && !rel.has(nid))); g.classList.toggle('focus', !!(id && nid === id)); });
    document.querySelectorAll('.edge').forEach(p => { const s = p.dataset.s, tS = p.dataset.t, on = s === id || tS === id; p.classList.toggle('dim', !!(id && !on)); p.classList.toggle('focus', !!(id && on)); });
    document.querySelectorAll('.labels text').forEach(tx => { const nid = tx.dataset.id; tx.classList.toggle('dim', !!(id && !rel.has(nid))); });
  }
  window.focusNode = (id, e) => { if (e && e.preventDefault) e.preventDefault(); if (e && e.stopPropagation) e.stopPropagation(); applyFocus(id); };
  canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); applyFocus(null); });
  canvas.addEventListener('click', () => { if (!moved) applyFocus(null); });
  // 演示：载入即高亮连接数最大的枢纽节点（右键可切换、右键空白处取消）
  let hubId = nodes[0].id, hubD = -1;
  nodes.forEach(nd => { const d = deg[nd.id] || 0; if (d > hubD) { hubD = d; hubId = nd.id; } });
  applyFocus(hubId);
</script>
</body>
</html>
