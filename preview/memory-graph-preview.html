<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>记忆核心 · 增强知识图谱预览</title>
<style>
  :root {
    --bg: #0b1020; --panel: #111a2e; --panel2: #0e1628;
    --txt: #e8eefc; --muted: #93a3c4; --line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(140% 120% at 50% -10%, #16213f 0%, #0b1020 60%); color: var(--txt); min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 22px 60px; }
  .head { margin-bottom: 16px; }
  .head h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: .02em; }
  .head p { margin: 0; color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .count { color: var(--muted); font-size: 12px; }
  .toolbar .sp { flex: 1; }
  button { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--txt); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.1); }
  .canvas { position: relative; height: 560px; border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(120% 120% at 50% 35%, #1a2749 0%, #0d1430 55%, #0a0f22 100%); }
  .canvas svg { width: 100%; height: 100%; display: block; }
  .edge { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 1.6; stroke-dasharray: 4 5; animation: dash 1.6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -16; } }
  .node text { font-size: 12px; fill: #dbe5fb; paint-order: stroke; stroke: rgba(10,14,32,.85); stroke-width: 3px; pointer-events: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .hint { margin-left: auto; opacity: .7; }
  .note { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🧠 记忆核心 · 增强知识图谱</h1>
    <p>力导向布局 · 按 kind 着色 · 渐变发光节点 · 节点按连接数放大 · 曲线渐变连线 · 悬停高亮 · 入场动画（预览用示例数据）</p>
  </div>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <span class="sp"></span>
    <button onclick="zoomBy(-0.15)">缩小</button>
    <button onclick="setZoom(1)">适应</button>
    <button onclick="zoomBy(0.15)">放大</button>
  </div>

  <div class="canvas" id="canvas"></div>

  <div class="legend" id="legend"></div>

  <div class="note">说明：这是增强版知识图谱的独立预览（示例数据）。实际数据来自你的本地 Markdown Vault；点击节点会打开对应知识卡。在 DSH 侧边栏底部点「记忆」即可在完整记忆库弹窗中查看。</div>
</div>

<script>
  const W = 980, H = 620;
  const KIND = { project: '#3b82f6', knowledge: '#22c55e', content: '#f43f5e', prompt: '#06b6d4', business: '#eab308', other: '#8b5cf6' };
  const KIND_LABEL = { project: '项目', knowledge: '知识', content: '内容', prompt: '提示词', business: '业务', other: '其他' };

  // 示例数据（节点）
  const nodes = [
    { id: 'a', title: 'DSH 插件发布与安装的版本/路径陷阱', kind: 'knowledge', tags: ['dsh','npx','插件安装'] },
    { id: 'b', title: 'Redis缓存雪崩：定义、触发场景与预防方案', kind: 'knowledge', tags: ['Redis','缓存','高可用'] },
    { id: 'c', title: 'ETERNAL 产品展（像素办公室）', kind: 'project', tags: ['项目','vision','ui'] },
    { id: 'd', title: '数据库索引原理与B+树加速机制', kind: 'knowledge', tags: ['数据库','索引'] },
    { id: 'e', title: '知识图谱绘画：从wikilink到视觉连线', kind: 'content', tags: ['图谱','可视化'] },
    { id: 'f', title: '三体叙事结构提示词', kind: 'prompt', tags: ['提示词','叙事'] },
    { id: 'g', title: '插件市场选品与上架流程', kind: 'business', tags: ['插件','npm','上架'] },
    { id: 'h', title: 'DSH 客户端 Slot 扩展指南', kind: 'knowledge', tags: ['dsh','slot','前端'] },
    { id: 'i', title: '记忆库目录结构约定', kind: 'knowledge', tags: ['记忆','vault'] },
    { id: 'j', title: 'Agent 预设与记忆召回联调', kind: 'project', tags: ['agent','记忆','召回'] },
  ];
  // 示例边（source,target）
  const edges = [
    { s:'a', t:'h' }, { s:'a', t:'g' }, { s:'a', t:'i' },
    { s:'b', t:'d' }, { s:'b', t:'i' },
    { s:'c', t:'j' }, { s:'c', t:'f' },
    { s:'d', t:'e' }, { s:'e', t:'f' },
    { s:'g', t:'h' }, { s:'j', t:'i' }, { s:'j', t:'c' },
    { s:'e', t:'b' },
  ];

  function hexToRgb(hex){ const h=hex.replace('#',''); const f=h.length===3?h.split('').map(c=>c+c).join(''):h; return [parseInt(f.slice(0,2),16),parseInt(f.slice(2,4),16),parseInt(f.slice(4,6),16)]; }
  function lighten(hex,amt){ const [r,g,b]=hexToRgb(hex); return `rgb(${Math.round(r+(255-r)*amt)},${Math.round(g+(255-g)*amt)},${Math.round(b+(255-b)*amt)})`; }
  function darken(hex,amt){ const [r,g,b]=hexToRgb(hex); return `rgb(${Math.round(r*(1-amt))},${Math.round(g*(1-amt))},${Math.round(b*(1-amt))})`; }

  function computeLayout(nodes, edges, width, height){
    const n = nodes.length;
    const pos = nodes.map((_,i)=>{ const a=(i/n)*Math.PI*2-Math.PI/2; return {x:Math.cos(a),y:Math.sin(a)}; });
    const vel = pos.map(()=>({x:0,y:0}));
    const adj = nodes.map(()=>[]);
    edges.forEach(e=>{ const si=nodes.findIndex(x=>x.id===e.s); const ti=nodes.findIndex(x=>x.id===e.t); if(si>=0&&ti>=0&&si!==ti){ adj[si].push(ti); adj[ti].push(si);} });
    const repulsion=1.35, attraction=0.035, center=0.03, damping=0.84;
    for(let it=0;it<280;it++){
      for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
        let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y;
        const d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2), f=repulsion/d2;
        const fx=(dx/d)*f, fy=(dy/d)*f;
        vel[i].x+=fx; vel[i].y+=fy; vel[j].x-=fx; vel[j].y-=fy;
      }
      for(let i=0;i<n;i++)for(const j of adj[i]){ vel[i].x+=(pos[j].x-pos[i].x)*attraction; vel[i].y+=(pos[j].y-pos[i].y)*attraction; }
      for(let i=0;i<n;i++){ vel[i].x-=pos[i].x*center; vel[i].y-=pos[i].y*center; }
      for(let i=0;i<n;i++){ vel[i].x=Math.max(-0.5,Math.min(0.5,vel[i].x*damping)); vel[i].y=Math.max(-0.5,Math.min(0.5,vel[i].y*damping)); pos[i].x+=vel[i].x; pos[i].y+=vel[i].y; }
    }
    let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
    pos.forEach(p=>{ minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y); });
    const pad=80; const scale=Math.min((width-2*pad)/(maxx-minx||1),(height-2*pad)/(maxy-miny||1));
    const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
    return pos.map(p=>({x:width/2+(p.x-cx)*scale,y:height/2+(p.y-cy)*scale}));
  }
  function edgePath(a,b){ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2; const dx=b.x-a.x,dy=b.y-a.y; const dist=Math.sqrt(dx*dx+dy*dy)||1; const bend=Math.min(38,dist*0.18); const cx=mx-(dy/dist)*bend, cy=my+(dx/dist)*bend; return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`; }

  function render(zoom){
    const root = document.getElementById('canvas');
    const layout = computeLayout(nodes, edges, W, H);
    const deg = {};
    edges.forEach(e=>{ deg[e.s]=(deg[e.s]||0)+1; deg[e.t]=(deg[e.t]||0)+1; });
    const idx = nodes.reduce((m,nd,i)=>(m[nd.id]=i,m),{});
    // dedupe edges
    const seen=new Set(); const shown=edges.filter(e=>{ const k=[e.s,e.t].sort().join('|'); if(seen.has(k))return false; seen.add(k); return true; });

    let defs = '';
    Object.keys(KIND).forEach(k=>{
      defs += `<radialGradient id="g-${k}" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="${lighten(KIND[k],0.55)}"/><stop offset="60%" stop-color="${KIND[k]}"/><stop offset="100%" stop-color="${darken(KIND[k],0.25)}"/></radialGradient>`;
      defs += `<linearGradient id="e-${k}" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="${KIND[k]}" stop-opacity="0.4"/><stop offset="100%" stop-color="${KIND[k]}" stop-opacity="0.85"/></linearGradient>`;
    });
    defs += `<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

    let edgesSvg = shown.map((e,i)=>{
      const si=idx[e.s], ti=idx[e.t]; if(si===undefined||ti===undefined)return '';
      const a=layout[si], b=layout[ti]; if(!a||!b)return '';
      const kind=nodes[si].kind||'other';
      return `<path d="${edgePath(a,b)}" class="edge" style="stroke:url(#e-${kind});animation-delay:${(i%8)*0.12}s" />`;
    }).join('');

    let nodesSvg = nodes.map((nd,i)=>{
      const p=layout[i]; if(!p)return '';
      const kind=nd.kind||'other';
      const r=8+Math.min(9,(deg[nd.id]||0)*1.4);
      return `<g class="node" transform="translate(${p.x} ${p.y})" style="animation:pop .5s cubic-bezier(.2,.8,.2,1) ${i*0.03}s backwards">
        <circle r="${r}" fill="url(#g-${kind})" stroke="${KIND[kind]}" stroke-opacity="0.9" filter="url(#glow)"/>
        <circle r="${Math.max(2.4,r*0.2)}" fill="rgba(255,255,255,.85)"/>
        <text x="${r+8}" y="3">${nd.title.slice(0,16)}</text></g>`;
    }).join('');

    root.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"><defs>${defs}</defs>
      <g transform="translate(${W/2} ${H/2}) scale(${zoom}) translate(${-W/2} ${-H/2})">${edgesSvg}${nodesSvg}</g></svg>`;
    document.getElementById('count').textContent = `${nodes.length} 节点 · ${shown.length} 连线`;
    document.getElementById('legend').innerHTML =
      Object.keys(KIND).map(k=>`<span class="lg"><span class="dot" style="background:${KIND[k]}"></span>${KIND_LABEL[k]}</span>`).join('') +
      `<span class="hint">节点=知识卡；连线=[[链接]] 或共享标签。点击节点阅读卡片。</span>`;
  }

  let zoom = 1;
  function setZoom(z){ zoom = z; render(zoom); }
  function zoomBy(d){ zoom = Math.max(0.5, Math.min(2.2, zoom + d)); render(zoom); }
  render(1);
</script>
</body>
</html>
